events {
    worker_connections 1024;
}

http {
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Upstream services
    upstream language_detection {
        server language-detection-service:3001;
    }

    upstream core_scanner {
        server core-scanner-service:3002;
    }

    upstream container_scanner {
        server container-scanner-service:3003;
    }

    upstream dependency_scanner {
        server dependency-scanner-service:3004;
    }

    server {
        listen 80;
        server_name _;

        # Health check
        location /health {
            access_log off;
            return 200 "API Gateway Healthy\n";
            add_header Content-Type text/plain;
        }

        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Handle OPTIONS requests
        if ($request_method = OPTIONS) {
            return 204;
        }

        # Language Detection Service
        location /api/v1/language-detection/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://language_detection/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # Core Scanner Service
        location /api/v1/scan/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://core_scanner/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Container Scanner Service
        location /api/v1/container-scan/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://container_scanner/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Dependency Scanner Service
        location /api/v1/dependency-scan/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://dependency_scanner/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Metrics endpoint (aggregate all services)
        location /metrics {
            return 200 "Use service-specific metrics endpoints\n";
            add_header Content-Type text/plain;
        }

        # Default route
        location / {
            return 404 '{"error": "Not Found", "message": "Invalid API endpoint"}';
            add_header Content-Type application/json;
        }
    }
}

version: '3.8'

services:
  # API Gateway (Nginx)
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - '80:80'
    depends_on:
      - language-detection
    networks:
      - securestack-network
    restart: unless-stopped

  # Language Detection Service
  language-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: language-detection-service
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_ENABLED=true
      - LOG_LEVEL=info
    networks:
      - securestack-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  securestack-network:
    driver: bridge
